[project]
name = "movie-ranker"
version = "0.1.0"
description = "Tool to analyze a movie collection and identify movies based on IMDB ratings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastparquet==2024.5.0",
    "hurry-filesize==0.9",
    "jinja2==3.1.4",
    "jupyterlab==4.3.0",
    "numpy==2.1.2",
    "omdbapi==0.7.0",
    "pandas==2.2.3",
    "pyarrow==18.0.0",
    "pyspark==3.5.3",
    "python-decouple==3.8",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = [
    "black==24.4.0",
    "mypy==1.8.0",
    "pylint==3.1.0",
    "pytest==8.0.0",
    "ruff==0.2.2",
]

[project.scripts]
movie-ranker = "src.movie_ranker.cli.movie_ranker_cli:main"
movie-scanner = "src.movie_ranker.cli.scanner_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 88
select = ["E", "F", "I", "W", "C90", "N", "UP", "B", "A", "COM", "C4", "PIE", "T20", "PT", "RET", "SLF", "SIM", "ARG", "ERA", "PL", "TRY", "RUF"]
ignore = []
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "dist",
    "build",
]

[tool.ruff.isort]
known-first-party = ["movie_ranker"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyspark.*", "tabulate.*", "omdbapi.*"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-attributes = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"